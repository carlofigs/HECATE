packages:
  - "apps/*"
  - "packages/*"
  # The v1 MCP server stays at /mcp so existing local registrations
  # (`npx tsx <repo>/mcp/src/index.ts`) keep working until P2 replaces it.
  - "mcp"

# Shared versions for v2 packages go in a `catalog:` here, referenced as
# `catalog:` in each manifest, so an upgrade is one line instead of one edit per
# package. It starts with the first v2 package (packages/core) rather than now:
# knip fails on catalog entries nothing uses. Target toolchain: React ~19.2,
# TypeScript ~6.0, Vite ^8, Vitest ^5, Tailwind ^4, zod ^4, zustand ^5.
#
# The frozen v1 packages (apps/web-v1, mcp) deliberately pin their own versions:
# they are deleted at cutover and are not migrated to the v2 toolchain.

# pnpm blocks dependency build scripts unless they are allowed here. esbuild
# (used by Vite and tsx) needs its postinstall to place the native binary.
allowBuilds:
  esbuild: true
