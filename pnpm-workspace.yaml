packages:
  - "apps/*"
  - "packages/*"
  # The v1 MCP server stays at /mcp so existing local registrations
  # (`npx tsx <repo>/mcp/src/index.ts`) keep working until P2 replaces it.
  - "mcp"
  # HECATE's Claude skills: a Claude Code plugin, and zips for claude.ai.
  - "plugin"

# Shared versions for v2 packages, referenced as `catalog:` in their manifests,
# so an upgrade is one line here instead of one edit per package. Add an entry
# when a manifest first uses it: knip fails on catalog entries nothing uses.
# React is held at ~19.2 on purpose (bundle size, as in the owner's other
# monorepo): do not bump it in passing.
#
# The frozen v1 packages (apps/web-v1, mcp) deliberately pin their own versions:
# they are deleted at cutover and are not migrated to the v2 toolchain.
catalog:
  "@axe-core/playwright": "^4.14.0"
  "@cloudflare/workers-oauth-provider": "^1.2.4"
  "@cloudflare/workers-types": "^5.20261106.1"
  "@dnd-kit/core": "^6.3.1"
  "@dnd-kit/sortable": "^10.0.0"
  "@dnd-kit/utilities": "^3.2.2"
  "@modelcontextprotocol/client": "^2.4.0"
  "@modelcontextprotocol/server": "^2.4.0"
  "@playwright/test": "^1.65.0"
  "@tailwindcss/node": "^4.3.5"
  "@tailwindcss/vite": "^4.3.5"
  "@types/culori": "^4.0.1"
  "@types/node": "^24.10.1"
  "@types/react": "~19.3.0"
  "@types/react-dom": "~19.3.0"
  "@vite-pwa/assets-generator": "^2.0.0"
  "@vitejs/plugin-react": "^6.3.0"
  "culori": "^4.0.2"
  "esbuild": "^0.28.2"
  "fflate": "^0.8.3"
  "fractional-indexing": "^4.0.0"
  "immer": "^11.2.9"
  "lucide-react": "^1.70.0"
  "miniflare": "4.20260730.0"
  "radix-ui": "^1.8.1"
  "react": "~19.2.9"
  "react-dom": "~19.2.9"
  "react-markdown": "^10.1.0"
  "react-router": "^8.5.1"
  "remark-gfm": "^4.0.1"
  "tailwindcss": "^4.3.5"
  "tsx": "^4.23.15"
  "typescript": "~6.0.3"
  "vite": "^8.3.6"
  "vite-plugin-pwa": "^2.0.0"
  "vitest": "^5.1.0"
  "workbox-build": "^7.4.1"
  "workbox-window": "^7.4.1"
  "wrangler": "^4.158.0"
  "zod": "^4.6.7"
  "zustand": "^5.1.0"

# pnpm blocks dependency build scripts unless they are allowed here. esbuild
# (used by Vite, tsx and wrangler) and workerd (the Workers runtime that
# wrangler and Miniflare run) need their postinstall to place a native binary.
allowBuilds:
  esbuild: true
  workerd: true
