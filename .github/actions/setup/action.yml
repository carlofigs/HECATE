name: Set up pnpm and Node
description: >-
  pnpm (the version in package.json's packageManager field), Node (the version
  in .nvmrc) with the pnpm store cached, and a frozen-lockfile install. CI and
  deploy both need exactly this, so it lives in one place.

runs:
  using: composite
  steps:
    # No `version:` on purpose — pnpm/action-setup reads it from the
    # packageManager field, so bumping pnpm is one edit in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
