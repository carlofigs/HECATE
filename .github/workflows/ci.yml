name: CI

# Gates for pull requests. Pushes to main are already gated by the identical
# steps inside deploy.yml, so this stays PR-only rather than running twice.
#
# Deliberately separate from deploy.yml: that workflow holds `pages: write` +
# `id-token: write` and a shared `concurrency: pages` group, so folding PR runs
# into it would hand every PR the Pages OIDC token and let a PR push cancel an
# in-flight production deploy.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a new push supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run the JS-based actions on Node 24 ahead of GitHub's forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unused files, exports, dependencies and catalog entries. The frozen v1
      # packages are excluded in knip.json; everything new must stay clean.
      - name: Dead code (knip)
        run: pnpm knip

      - name: Test
        run: pnpm test

      # Typecheck and lint do not compile CSS or bundle; this catches anything
      # that only fails at build time before it reaches main.
      - name: Build
        run: pnpm build

  # The v2 app end to end: the built web app served by the bundled Worker in
  # workerd, against the fake GitHub (apps/worker/e2e). Sign-in, Today in every
  # state, and the accessibility gate (axe, target sizes, reflow, focus) at
  # three widths in both colour schemes. No secrets: nothing leaves the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Playwright version
        id: playwright
        working-directory: apps/worker
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: apps/worker
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: apps/worker
        run: pnpm exec playwright install-deps chromium

      - name: End-to-end and accessibility
        run: pnpm --filter @hecate/worker e2e
