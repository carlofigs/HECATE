name: CI

# Gates for pull requests. Pushes to main are already gated by the identical
# steps inside deploy.yml, so this stays PR-only rather than running twice.
#
# Deliberately separate from deploy.yml: that workflow holds `pages: write` +
# `id-token: write` and a shared `concurrency: pages` group, so folding PR runs
# into it would hand every PR the Pages OIDC token and let a PR push cancel an
# in-flight production deploy.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a new push supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run the JS-based actions on Node 24 ahead of GitHub's forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unused files, exports, dependencies and catalog entries. The frozen v1
      # packages are excluded in knip.json; everything new must stay clean.
      - name: Dead code (knip)
        run: pnpm knip

      - name: Test
        run: pnpm test

      # Typecheck and lint do not compile CSS or bundle; this catches anything
      # that only fails at build time before it reaches main.
      - name: Build
        run: pnpm build
