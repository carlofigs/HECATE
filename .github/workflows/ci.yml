name: CI

# Gates for pull requests. Pushes to main are already gated by the identical
# steps inside deploy.yml, so this stays PR-only rather than running twice.
#
# Deliberately separate from deploy.yml: that workflow holds `pages: write` +
# `id-token: write` and a shared `concurrency: pages` group with
# cancel-in-progress, so folding PR runs into it would hand every PR the Pages
# OIDC token and let a PR push cancel an in-flight production deploy.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a new push supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Deploy runs this too — catching a build break here keeps it off main.
      - name: Build
        run: npm run build
